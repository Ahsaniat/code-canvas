name: Release

# Manual-trigger-safe, publish-on-release CD. Creating a GitHub release whose
# tag matches the extension version publishes to the Marketplace and Open VSX
# and attaches the VSIX to the release.
#
# Required repository secrets:
#   VSCE_PAT  - Azure DevOps PAT, Marketplace > Manage       (required)
#   OVSX_PAT  - open-vsx.org access token                    (optional)
#
# Recommended: create an environment named "marketplace" with a required
# reviewer so a release cannot publish without approval.

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: write # attach the VSIX to the release

    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Guard - tag matches the extension version
        run: |
          VERSION="$(node -p "require('./extension/package.json').version")"
          TAG="${{ github.event.release.tag_name }}"
          if [ "$TAG" != "v$VERSION" ] && [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match extension version '$VERSION'. Tag releases as v$VERSION."
            exit 1
          fi
          echo "Releasing $TAG (extension version $VERSION)"

      - name: Build
        run: npm run build

      - name: Package VSIX
        id: package
        run: |
          cd extension
          npx vsce package --no-dependencies
          VSIX="code-canvas-oss-$(node -p "require('./package.json').version").vsix"
          test -f "$VSIX"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"
          echo "Packaged $VSIX"

      - name: Publish to the Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT secret is not set."
            exit 1
          fi
          cd extension
          npx vsce publish --packagePath "${{ steps.package.outputs.vsix }}" -p "$VSCE_PAT"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT is not set - skipping Open VSX."
            exit 0
          fi
          cd extension
          npx --yes ovsx publish "${{ steps.package.outputs.vsix }}" -p "$OVSX_PAT"

      - name: Attach the VSIX to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "extension/${{ steps.package.outputs.vsix }}" --clobber
